name: Build MI_FACTUR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Ejecutar pruebas
        run: gradle testDebugUnitTest

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MI_FACTUR-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MI_FACTUR-debug-apk
          path: MI_FACTUR-debug.apk
