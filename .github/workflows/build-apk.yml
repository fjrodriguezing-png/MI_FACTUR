name: Build MI_FACTUR APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.4' }
   - name: Compile with detailed errors
     run: gradle assembleDebug --stacktrace
   - run: cp app/build/outputs/apk/debug/app-debug.apk MI_FACTUR-CORREGIDO.apk
   - uses: actions/upload-artifact@v4
     with: { name: MI_FACTUR-CORREGIDO-APK, path: MI_FACTUR-CORREGIDO.apk }
